  },
  subject(f) {
    const name = f.name.value.trim(); if (!name) return setError('Enter a subject name.');
    const grades = readGbEditor(f.querySelector('#gb-editor')); if (!grades || !grades.length) return setError('Add at least one grade with a minimum percentage.');
    const names = grades.map(g => g.name); if (new Set(names).size !== names.length) return setError('Grade names must be unique.');
    const target = grades.some(g => g.name === f.target.value) ? f.target.value : grades[0].name;
    const data = { name, code: f.code.value.trim(), target, mode: f.mode.value, weight: Engine.num(f.weight.value), grades };
    const id = f.id.value; const existing = id && subjectById(id);
    let sid = id;
    if (existing) Object.assign(existing, data);
    else { if (state.subjects.length >= MAX_SUBJECTS) return setError(`You can track up to ${MAX_SUBJECTS} subjects.`); sid = uid(); state.subjects.push({ id: sid, color: nextColor(), ...data }); }
    closeModal(); go('subject', { subjectId: sid }); save(); toast(existing ? `${name} updated` : `${name} added`);
  },
  assessment(f) {
    const obtained = Engine.num(f.obtained.value), max = Engine.num(f.max.value), weight = Engine.num(f.weight.value);
    if (max == null || max <= 0) return setError('Maximum marks must be greater than 0.');
    if (obtained == null || obtained < 0) return setError('Enter the marks obtained.');
    if (obtained > max) return setError('Marks obtained cannot exceed the maximum marks.');
    if (weight != null && (weight < 0 || weight > 100)) return setError('Weightage must be between 0 and 100.');
    if (!f.name.value.trim()) return setError('Give the assessment a name.');

    const data = { subjectId: f.subjectId.value, name: f.name.value.trim(), date: f.date.value || todayISO(), type: f.type.value, obtained, max, weight: weight === 0 ? null : weight, notes: f.notes.value.trim() };

    const subj = subjectById(data.subjectId);

    toast(`${data.name} ${f.fromUpcoming.value ? 'recorded' : existing ? 'updated' : 'added'} in ${subj.name}`);
  },
  upcoming(f) {
    const max = Engine.num(f.max.value), weight = Engine.num(f.weight.value), expected = Engine.num(f.expected.value);

    if (weight != null && (weight < 0 || weight > 100)) return setError('Weightage must be between 0 and 100.');
    if (expected != null && (expected < 0 || expected > 100)) return setError('Expected score must be between 0 and 100%.');
    if (!f.date.value) return setError('Choose a date.');
    if (!f.name.value.trim()) return setError('Give the test a name.');
    if (!subjectById(f.subjectId.value)) return setError('Choose a subject.');
    const data = { subjectId: f.subjectId.value, name: f.name.value.trim(), date: f.date.value, max, weight: weight === 0 ? null : weight, target: f.target.value, expected, notes: f.notes.value.trim() };
    const id = f.id.value; const existing = id && state.upcoming.find(u => u.id === id);

function reportError(err) {
  const msg = (err && err.message) ? err.message : String(err || 'Unknown error');
  try { console.error(err); } catch (e) { /* no console */ }
  if (Date.now() - lastError < 1500) return; lastError = Date.now();
  const box = $('#form-error'); if (box && ui.modal) box.textContent = 'Something went wrong: ' + msg;
  else if ($('#toast-root')) toast('Something went wrong: ' + msg);
}
function runForm(f) {
  const fn = forms[f.dataset.form]; if (!fn) return;
  try { fn(f); } catch (err) { reportError(err); }
}
function init() {
  ['modal-root', 'toast-root'].forEach(id => { if (!document.getElementById(id)) { const d = document.createElement('div'); d.id = id; document.body.appendChild(d); } });
  // Save buttons run by plain click (and Enter in a field), never through native form submission,
  // which sandboxed previews block silently.
  document.addEventListener('click', e => {
    const submit = e.target.closest('button[type="submit"]');
    if (submit) { const f = submit.closest('form[data-form]'); if (f) { e.preventDefault(); runForm(f); return; } }
    const el = e.target.closest('[data-action]'); if (!el) return;
    const fn = actions[el.dataset.action]; if (fn) { try { fn(el, e); } catch (err) { reportError(err); } }
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && ui.modal) closeModal();
    if (e.key === 'Enter' && e.target.matches('[role="button"][data-action]')) e.target.click();
    if (e.key === 'Enter' && e.target.matches('form[data-form] input') && e.target.type !== 'file') { const f = e.target.closest('form[data-form]'); if (f) { e.preventDefault(); runForm(f); } }
  });
  document.addEventListener('submit', e => { const f = e.target.closest('form[data-form]'); if (!f) return; e.preventDefault(); runForm(f); });
  window.addEventListener('error', e => reportError(e.error || e.message));
  document.addEventListener('change', e => { const el = e.target.closest('[data-change]'); if (!el) return; const fn = changes[el.dataset.change]; if (fn) fn(el, e); });
  document.addEventListener('input', e => { const el = e.target.closest('[data-live]'); if (!el) return; const fn = lives[el.dataset.live]; if (fn) fn(el, e); });
  if (window.matchMedia) { try { window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (state.settings.theme === 'system') render(); }); } catch (e) { /* older browsers */ } }
  if (typeof storageKey !== 'function') { try { if (!localStorage.getItem(KEY)) localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { storageOK = false; } }
  render({ top: true });
  cloudInit();
}
init();
