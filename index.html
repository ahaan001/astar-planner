<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A* Planner</title>
<meta name="description" content="Grade tracker and A* planner: subjects, weighted assessments, grade boundaries, upcoming tests, required scores, predictions and calendar.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Figtree:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: fixed sidebar on desktop, top bar + bottom tab bar on phones; content column of cards. */
:root {
  --bg: #f3f6fb; --surface: #ffffff; --surface-2: #eaf0f9; --surface-3: #dfe7f4;
  --border: #e3e9f3; --fg: #0f1a2e; --muted: #5a6b86; --faint: #8b99b2;
  --primary: #2457e6; --primary-strong: #1a45bd; --primary-soft: #e3ebff; --primary-fg: #ffffff;
  --good: #148a58; --good-soft: #dcf5e8; --warn: #b96f00; --warn-soft: #fff0d3; --bad: #cf2f3a; --bad-soft: #fde2e4;
  --shadow: 0 1px 2px rgba(15, 26, 46, .05), 0 6px 20px -8px rgba(15, 26, 46, .12);
  --display: 'Outfit', 'Segoe UI', system-ui, sans-serif;
  --body: 'Figtree', 'Segoe UI', system-ui, sans-serif;
  --mono: 'DM Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  --radius: 16px; --radius-s: 10px;
  --nav-h: 64px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b1120; --surface: #121a2b; --surface-2: #192338; --surface-3: #212d46;
    --border: #273450; --fg: #eaf0fa; --muted: #9aa9c4; --faint: #6d7c98;
    --primary: #5d8dff; --primary-strong: #82a8ff; --primary-soft: #1a2a4f; --primary-fg: #071026;
    --good: #3ecf8c; --good-soft: #10301f; --warn: #f2b74f; --warn-soft: #3a2a0e; --bad: #ff6e76; --bad-soft: #3d151a;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px -10px rgba(0, 0, 0, .5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b1120; --surface: #121a2b; --surface-2: #192338; --surface-3: #212d46;
  --border: #273450; --fg: #eaf0fa; --muted: #9aa9c4; --faint: #6d7c98;
  --primary: #5d8dff; --primary-strong: #82a8ff; --primary-soft: #1a2a4f; --primary-fg: #071026;
  --good: #3ecf8c; --good-soft: #10301f; --warn: #f2b74f; --warn-soft: #3a2a0e; --bad: #ff6e76; --bad-soft: #3d151a;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px -10px rgba(0, 0, 0, .5);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
h1, h2, h3, h4 { font-family: var(--display); margin: 0; line-height: 1.2; text-wrap: balance; font-weight: 600; }
h1 { font-size: 1.75rem; } h2 { font-size: 1.25rem; } h3 { font-size: 1.05rem; } h4 { font-size: .95rem; }
p { margin: 0; }
a { color: var(--primary); }
button { font: inherit; color: inherit; }
input, select, textarea { font: inherit; color: inherit; }
.num, .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.tnum { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.faint { color: var(--faint); }
.small { font-size: .85rem; }
.xs { font-size: .78rem; }
.strong { font-weight: 600; }
.hidden { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

/* App frame */
#app { min-height: 100%; }
.frame { display: grid; grid-template-columns: 248px 1fr; min-height: 100%; }
.sidebar { position: sticky; top: env(safe-area-inset-top, 0px); height: 100vh; background: var(--surface); border-right: 1px solid var(--border); padding: 22px 16px; display: flex; flex-direction: column; gap: 6px; }
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 18px; }
.brand .logo { width: 36px; height: 36px; border-radius: 11px; background: var(--primary); color: var(--primary-fg); display: grid; place-items: center; font-family: var(--display); font-weight: 700; font-size: 1.1rem; }
.brand .name { font-family: var(--display); font-weight: 700; font-size: 1.15rem; letter-spacing: -.01em; }
.brand .sub { font-size: .72rem; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
.nav-item { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: var(--radius-s); border: 0; background: transparent; cursor: pointer; text-align: left; color: var(--muted); font-weight: 500; width: 100%; transition: background .15s, color .15s; }
.nav-item svg { width: 20px; height: 20px; flex: none; }
.nav-item:hover { background: var(--surface-2); color: var(--fg); }
.nav-item.active { background: var(--primary-soft); color: var(--primary-strong); font-weight: 600; }
.sidebar .spacer { flex: 1; }
.side-foot { border-top: 1px solid var(--border); padding-top: 12px; display: flex; flex-direction: column; gap: 10px; }
.overall-mini { padding: 12px; border-radius: var(--radius-s); background: var(--surface-2); }
.overall-mini .v { font-family: var(--display); font-size: 1.5rem; font-weight: 700; }

.main { min-width: 0; padding-block: 28px 40px; padding-inline: clamp(16px, 3vw, 40px); }
.content { max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }

.topbar, .bottomnav { display: none; }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 9px 14px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); cursor: pointer; font-weight: 600; font-size: .9rem; line-height: 1.2; transition: background .15s, border-color .15s, transform .05s; white-space: nowrap; }
.btn:hover { background: var(--surface-2); }
.btn:active { transform: translateY(1px); }
.btn svg { width: 16px; height: 16px; }
.btn.primary { background: var(--primary); border-color: var(--primary); color: var(--primary-fg); }
.btn.primary:hover { background: var(--primary-strong); border-color: var(--primary-strong); }
.btn.danger { color: var(--bad); }
.btn.danger:hover { background: var(--bad-soft); border-color: var(--bad-soft); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--surface-2); }
.btn.sm { padding: 6px 10px; font-size: .82rem; }
.btn.icon { padding: 7px; }
.btn.icon svg { width: 18px; height: 18px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.seg { display: inline-flex; background: var(--surface-2); border-radius: 10px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: transparent; padding: 6px 12px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: .85rem; color: var(--muted); }
.seg button.active { background: var(--surface); color: var(--fg); box-shadow: var(--shadow); }

/* Cards & sections */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 22px; }
.card.soft { background: var(--surface-2); border: 0; }
.card.pad-s { padding: 16px; }
.card.clickable { cursor: pointer; transition: transform .15s, box-shadow .15s, border-color .15s; }
.card.clickable:hover { transform: translateY(-2px); box-shadow: var(--shadow); border-color: var(--surface-3); }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.page-head .actions { display: flex; gap: 8px; flex-wrap: wrap; }
.section-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
.eyebrow { font-size: .72rem; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); font-weight: 600; }
.grid { display: grid; gap: 16px; }
.grid.cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.grid.cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.grid.cols-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.grid.auto { grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
.grid.auto-sm { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
.stack { display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.between { justify-content: space-between; }
.kpi .label { font-size: .78rem; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .06em; }
.kpi .value { font-family: var(--display); font-size: 1.9rem; font-weight: 700; line-height: 1.1; margin-top: 4px; font-variant-numeric: tabular-nums; }
.kpi .value.sm { font-size: 1.4rem; }
.kpi .hint { font-size: .82rem; color: var(--muted); margin-top: 4px; }
.big { font-family: var(--display); font-size: 2.6rem; font-weight: 700; line-height: 1; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }

/* Chips & pills */
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 999px; font-size: .78rem; font-weight: 600; background: var(--surface-2); color: var(--muted); white-space: nowrap; line-height: 1.4; }
.chip.good { background: var(--good-soft); color: var(--good); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
.chip.primary { background: var(--primary-soft); color: var(--primary-strong); }
.chip.grade { font-family: var(--display); font-size: .9rem; padding: 3px 10px; }
.dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; }
.swatch { width: 4px; align-self: stretch; border-radius: 4px; flex: none; }
.status-line { display: flex; align-items: flex-start; gap: 10px; padding: 12px 14px; border-radius: 12px; font-weight: 500; }
.status-line svg { width: 18px; height: 18px; flex: none; margin-top: 2px; }
.status-line.good { background: var(--good-soft); color: var(--good); }
.status-line.warn { background: var(--warn-soft); color: var(--warn); }
.status-line.bad { background: var(--bad-soft); color: var(--bad); }
.status-line.neutral { background: var(--surface-2); color: var(--muted); }

/* Progress bar */
.bar { position: relative; height: 10px; border-radius: 999px; background: var(--surface-3); overflow: visible; margin: 10px 0 6px; }
.bar .fill { height: 100%; border-radius: 999px; background: var(--primary); transition: width .5s cubic-bezier(.2, .8, .2, 1); }
.bar .fill.good { background: var(--good); }
.bar .fill.bad { background: var(--bad); }
.bar .fill.warn { background: var(--warn); }
.bar .mark { position: absolute; top: -4px; width: 2px; height: 18px; background: var(--fg); border-radius: 2px; opacity: .8; }
.bar-labels { display: flex; justify-content: space-between; font-size: .78rem; color: var(--muted); font-variant-numeric: tabular-nums; }

/* Subject card on dashboard */
.subject-card { display: flex; flex-direction: column; gap: 10px; position: relative; overflow: hidden; }
.subject-card .head { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
.subject-card .head > .xs { white-space: nowrap; flex: none; padding-top: 3px; }
.subject-card .title { display: flex; align-items: center; gap: 8px; min-width: 0; }
.subject-card .title h3 { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.subject-card .pct { font-family: var(--display); font-size: 2rem; font-weight: 700; line-height: 1; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.subject-card .meta { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px; font-size: .84rem; }
.subject-card .meta .k { color: var(--muted); }
.subject-card .need { font-weight: 600; }

/* Priority list */
.prio { display: flex; flex-direction: column; }
.prio-item { display: flex; align-items: center; gap: 12px; padding: 12px 4px; border-top: 1px solid var(--border); }
.prio-item:first-child { border-top: 0; }
.prio-item .txt { flex: 1; min-width: 0; }
.prio-item .msg { font-size: .88rem; color: var(--muted); }

/* Tables (styled as lists) */
.table-wrap { overflow-x: auto; }
table.t { width: 100%; border-collapse: separate; border-spacing: 0; font-size: .9rem; }
table.t th { text-align: left; font-size: .72rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; padding: 8px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; }
table.t th.sortable { cursor: pointer; user-select: none; }
table.t th.sortable:hover { color: var(--fg); }
table.t td { padding: 11px 10px; border-bottom: 1px solid var(--border); vertical-align: middle; }
table.t tr:last-child td { border-bottom: 0; }
table.t td.r, table.t th.r { text-align: right; }
table.t td.num { font-family: var(--mono); font-size: .86rem; }
table.t tr.hl td { background: var(--good-soft); }
table.t tr.custom td { background: var(--primary-soft); }
table.t .acts { display: flex; gap: 4px; justify-content: flex-end; }
table.t tbody tr.link { cursor: pointer; }
table.t tbody tr.link:hover td { background: var(--surface-2); }

/* Forms */
.form { display: grid; gap: 14px; }
.form .two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.form .three { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field label { font-size: .8rem; font-weight: 600; color: var(--muted); }
.field .help { font-size: .76rem; color: var(--faint); }
.input, .field input, .field select, .field textarea { width: 100%; padding: 9px 11px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); color: var(--fg); min-width: 0; }
.field input:focus, .field select:focus, .field textarea:focus, .input:focus { outline: 2px solid var(--primary); outline-offset: 0; border-color: var(--primary); }
.field textarea { min-height: 70px; resize: vertical; }
.field input[type="number"] { font-variant-numeric: tabular-nums; }
.inline-num { display: inline-flex; align-items: center; gap: 6px; }
.inline-num input { width: 84px; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--fg); font-family: var(--mono); font-size: .88rem; text-align: right; }
.inline-num input.sm { width: 64px; }
.check { display: flex; align-items: center; gap: 8px; font-size: .9rem; }
.check input { width: 16px; height: 16px; }
select.input { appearance: auto; }
.form-error { color: var(--bad); font-size: .85rem; font-weight: 500; }

/* Grade boundary editor */
.gb-editor { display: grid; gap: 6px; }
.gb-row { display: grid; grid-template-columns: 1fr 90px 90px 36px; gap: 8px; align-items: center; }
.gb-row.head { font-size: .72rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; }
.gb-row input { padding: 7px 9px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--fg); min-width: 0; width: 100%; }
.gb-row input.num { text-align: right; }
.gb-list { display: flex; flex-wrap: wrap; gap: 6px; }
.gb-list .chip { font-family: var(--mono); font-weight: 500; }

/* Modal */
.modal-bg { position: fixed; inset: 0; background: rgba(6, 12, 26, .55); display: flex; align-items: flex-end; justify-content: center; z-index: 50; padding: 0; animation: fade .15s ease-out; backdrop-filter: blur(2px); }
.modal { background: var(--surface); width: min(640px, 100%); max-height: calc(100% - env(safe-area-inset-top, 0px)); overflow: auto; border-radius: 20px 20px 0 0; padding: 22px 20px calc(24px + env(safe-area-inset-bottom, 0px)); box-shadow: var(--shadow); animation: up .2s cubic-bezier(.2, .8, .2, 1); }
.modal.wide { width: min(800px, 100%); }
.modal-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
.modal-foot { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; flex-wrap: wrap; }
.modal-foot .left { margin-right: auto; }
@media (min-width: 640px) {
  .modal-bg { align-items: center; padding: 20px; }
  .modal { border-radius: 20px; max-height: calc(100vh - 40px); padding: 24px; }
}
@keyframes fade { from { opacity: 0 } to { opacity: 1 } }
@keyframes up { from { transform: translateY(16px); opacity: .6 } to { transform: none; opacity: 1 } }
@keyframes pop { from { transform: translateY(6px); opacity: 0 } to { transform: none; opacity: 1 } }
.pop { animation: pop .25s ease-out both; }

/* Toast */
.toast { position: fixed; left: 50%; bottom: calc(var(--nav-h) + 16px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-weight: 600; font-size: .88rem; z-index: 60; box-shadow: var(--shadow); animation: up .2s ease-out; max-width: calc(100% - 32px); }
@media (min-width: 900px) { .toast { bottom: 24px; } }

/* Calendar */
.cal-toolbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.cal-dow { font-size: .72rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; text-align: center; padding: 6px 0; }
.cal-cell { min-height: 96px; border: 1px solid var(--border); border-radius: 10px; padding: 6px; background: var(--surface); display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.cal-cell.other { background: transparent; opacity: .55; }
.cal-cell.today { border-color: var(--primary); box-shadow: inset 0 0 0 1px var(--primary); }
.cal-cell .d { font-size: .8rem; font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; }
.cal-cell.today .d { color: var(--primary); }
.ev { display: block; width: 100%; text-align: left; border: 0; cursor: pointer; padding: 3px 6px; border-radius: 6px; font-size: .74rem; font-weight: 600; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.35; }
.ev:hover { filter: brightness(1.08); }
.cal-week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; }
.cal-week .cal-cell { min-height: 160px; }
.cal-list .month-h { margin: 18px 0 8px; }
.cal-list .item { display: flex; gap: 14px; align-items: center; padding: 10px 6px; border-top: 1px solid var(--border); cursor: pointer; border-radius: 8px; }
.cal-list .item:hover { background: var(--surface-2); }
.cal-list .item .day { font-family: var(--display); font-size: 1.4rem; font-weight: 700; width: 44px; text-align: center; font-variant-numeric: tabular-nums; }
.cal-list .item .txt { flex: 1; min-width: 0; }
.legend { display: flex; flex-wrap: wrap; gap: 8px 14px; font-size: .8rem; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }

/* Charts */
.chart { width: 100%; height: auto; display: block; }
.chart text { font-family: var(--body); font-size: 11px; fill: var(--muted); }
.chart .grid-line { stroke: var(--border); stroke-width: 1; }
.chart .target { stroke: var(--good); stroke-width: 1.5; stroke-dasharray: 5 4; }
.chart .line { fill: none; stroke: var(--primary); stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
.chart .area { fill: var(--primary); opacity: .1; }
.chart .pt { fill: var(--surface); stroke: var(--primary); stroke-width: 2.5; }
.chart .pt.last { fill: var(--primary); }
.chart .lbl { font-size: 10.5px; }
.chart .lbl.target { fill: var(--good); font-weight: 600; }

/* Breakdown */
.breakdown { font-family: var(--mono); font-size: .84rem; display: grid; gap: 4px; }
.breakdown .r { display: grid; grid-template-columns: minmax(0, 1fr) auto auto auto; gap: 12px; padding: 5px 0; border-bottom: 1px dashed var(--border); align-items: baseline; }
.breakdown .r:last-child { border-bottom: 0; font-weight: 600; }
.breakdown .r .n { font-family: var(--body); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.breakdown .r .x { color: var(--muted); }

/* Setup wizard */
.setup { min-height: 100vh; display: grid; place-items: center; padding-block: 32px; padding-inline: 16px; }
.setup .card { width: min(880px, 100%); }
.steps { display: flex; gap: 8px; align-items: center; font-size: .82rem; color: var(--muted); margin-bottom: 18px; flex-wrap: wrap; }
.steps .s { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; background: var(--surface-2); }
.steps .s.active { background: var(--primary-soft); color: var(--primary-strong); font-weight: 600; }
.setup-rows { display: grid; gap: 10px; }
.setup-row { display: grid; grid-template-columns: 28px 1.4fr .8fr 1fr .7fr auto; gap: 8px; align-items: center; }
.setup-row .idx { font-family: var(--mono); color: var(--faint); font-size: .8rem; text-align: right; }
.setup-row input, .setup-row select { padding: 8px 10px; border-radius: 9px; border: 1px solid var(--border); background: var(--surface); color: var(--fg); min-width: 0; width: 100%; }
.setup-row.head { font-size: .72rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; }
.setup-gb { grid-column: 1 / -1; padding: 12px; background: var(--surface-2); border-radius: 12px; }

/* What-if */
.whatif-result { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.slider { width: 100%; accent-color: var(--primary); }
.range-row { display: flex; align-items: center; gap: 12px; }

/* Predictions */
.pred-row { display: grid; grid-template-columns: minmax(0, 1.4fr) auto auto auto; gap: 10px 14px; align-items: center; padding: 10px 0; border-top: 1px solid var(--border); font-size: .9rem; }
.pred-row:first-of-type { border-top: 0; }

<body>
<div id="app"></div>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script>
/* Grade calculation engine. Pure functions, no DOM. Works in browser and Node. */
const Engine = (() => {
  const num = v => (v === '' || v == null) ? null : (isFinite(+v) ? +v : null);
  const sum = arr => arr.reduce((a, b) => a + b, 0);
  const round = (v, d = 1) => (v == null || !isFinite(v)) ? null : Math.round(v * 10 ** d) / 10 ** d;
  const pct = (o, m) => (m > 0 ? (o / m) * 100 : 0);
  const hasWeight = a => { const w = num(a.weight); return w != null && w > 0; };
  const EPS = 1e-9;

  function sortedGrades(grades) {
    return (grades || [])
      .filter(g => g && g.name != null && String(g.name).trim() !== '' && num(g.min) != null)
      .map(g => ({ name: String(g.name).trim(), min: +g.min, max: num(g.max) }))
      .sort((a, b) => b.min - a.min);
  }

  function gradeFor(p, grades) {
    if (p == null || !isFinite(p)) return null;
    for (const g of sortedGrades(grades)) if (p >= g.min - EPS) return g.name;
    return null;
  }

  function boundaryFor(name, grades) {
    const g = sortedGrades(grades).find(g => g.name === name);
    return g ? g.min : null;
  }

  // Resolve a grade name to {name, min}; falls back to the subject target, then the top grade.
  function resolveTarget(subject, name) {
    const gs = sortedGrades(subject.grades);
    if (!gs.length) return { name: null, min: null };
    const g = gs.find(g => g.name === name) || gs.find(g => g.name === subject.target) || gs[0];
    return { name: g.name, min: g.min };
  }

  function subjectMode(subject, completed, upcoming) {
    if (subject.mode === 'weighted' || subject.mode === 'marks') return subject.mode;
    const any = completed.some(hasWeight) || upcoming.some(hasWeight);
    return any ? 'weighted' : 'marks';
  }

  // Unified model: in weighted mode w = weightage, in marks mode w = max marks.
  // Either way the subject percentage is sum(pct_i * w_i) / sum(w_i).
  function buildModel(subject, allCompleted, allUpcoming) {
    const completed = allCompleted.filter(a => a.subjectId === subject.id);
    const upcoming = allUpcoming.filter(u => u.subjectId === subject.id);
    const mode = subjectMode(subject, completed, upcoming);

    const cItems = completed.map(a => {
      const max = num(a.max) ?? 0, obtained = num(a.obtained) ?? 0;
      const p = pct(obtained, max);
      const w = mode === 'weighted' ? (hasWeight(a) ? +a.weight : null) : max;
      const included = w != null && w > 0 && max > 0;
      return { ...a, obtained, max, pct: p, w, included, contribution: included ? p * w : 0 };
    });
    const uItems = upcoming.map(u => {
      const max = num(u.max) ?? 0;
      const w = mode === 'weighted' ? (hasWeight(u) ? +u.weight : null) : max;
      const included = w != null && w > 0 && max > 0;
      const e = num(u.expected);
      return { ...u, max, w, included, expectedPct: e != null ? Math.max(0, e) : null };
    });

    const incC = cItems.filter(i => i.included), incU = uItems.filter(i => i.included);
    const Wc = sum(incC.map(i => i.w));
    const Wu = sum(incU.map(i => i.w));
    const sumC = sum(incC.map(i => i.contribution));
    const current = Wc > 0 ? sumC / Wc : null;
    const marksObtained = sum(incC.map(i => i.obtained)), marksMax = sum(incC.map(i => i.max));

    return {
      subject, mode, completed: cItems, upcoming: uItems,
      Wc, Wu, Wtotal: Wc + Wu, sumC, current,
      marksObtained, marksMax,
      excludedCompleted: cItems.filter(i => !i.included),
      excludedUpcoming: uItems.filter(i => !i.included),
      grade: gradeFor(current, subject.grades),
    };
  }

  // Weightage validation (weighted mode only).
  function weightSummary(model) {
    if (model.mode !== 'weighted') return { mode: 'marks', ok: true, completed: model.marksMax, upcoming: sum(model.upcoming.filter(u => u.included).map(u => u.max)) };
    const total = model.Wc + model.Wu;
    return {
      mode: 'weighted', completed: model.Wc, upcoming: model.Wu, total,
      ok: Math.abs(total - 100) < 0.005,
      over: total > 100 + 0.005, under: total < 100 - 0.005,
      excluded: model.excludedCompleted.length + model.excludedUpcoming.length,
    };
  }

  // Requirement analysis against a target boundary T (percent).
  function analyze(model, T) {
    const { Wc, Wu, Wtotal, sumC, current } = model;
    const base = { T, current, Wc, Wu, Wtotal, perTest: [], required: null, minPossible: null, maxPossible: null, distance: null };
    if (T == null) return { ...base, status: 'no_target' };
    if (Wtotal <= 0) return { ...base, status: 'empty' };
    const minPossible = sumC / Wtotal;
    const maxPossible = (sumC + 100 * Wu) / Wtotal;
    const required = Wu > 0 ? (T * Wtotal - sumC) / Wu : null;
    let status;
    if (minPossible >= T - EPS) status = 'secured';
    else if (Wu <= 0) status = 'missed';
    else if (maxPossible < T - EPS) status = 'impossible';
    else if (current != null && current >= T - EPS) status = 'on_track';
    else status = 'needs';
    // Per upcoming test, ordered by date. afterPct/afterMarks: what this test needs, from the current position,
    // to be AT the boundary right after it (earlier results + this test only). afterMax: the best percentage
    // reachable right after it. pct/marks: the course-end even plan (same % on every remaining test).
    const perTest = model.upcoming.filter(u => u.included).slice().sort((a, b) => String(a.date || '9999').localeCompare(String(b.date || '9999'))).map(u => {
      const afterPct = (T * (Wc + u.w) - sumC) / u.w;
      return {
        id: u.id, name: u.name, date: u.date, max: u.max, w: u.w,
        afterPct, afterMarks: marksFor(afterPct, u.max), afterMax: (sumC + 100 * u.w) / (Wc + u.w),
        pct: required, marks: required == null ? null : marksFor(required, u.max),
      };
    });
    return { ...base, status, required, minPossible, maxPossible, perTest, next: perTest[0] || null, distance: current == null ? null : T - current };
  }

  // Smallest whole mark count that meets a required percentage.
  function marksFor(reqPct, max) {
    if (reqPct == null || !(max > 0)) return null;
    return Math.min(max, Math.max(0, Math.ceil((reqPct / 100) * max - EPS)));
  }

  // Predicted final using expected scores; unpredicted tests use `fill` (current avg by default).
  function predict(model, T, assumption = 'current') {
    let s = model.sumC, unpredictedW = 0, predictedW = 0;
    for (const u of model.upcoming.filter(u => u.included)) {
      if (u.expectedPct != null) { s += u.expectedPct * u.w; predictedW += u.w; }
      else unpredictedW += u.w;
    }
    const fill = assumption === 'target' ? (T ?? 0) : assumption === 'zero' ? 0 : (model.current ?? (T ?? 0));
    const final = model.Wtotal > 0 ? (s + fill * unpredictedW) / model.Wtotal : null;
    const requiredRest = (unpredictedW > 0 && T != null) ? (T * model.Wtotal - s) / unpredictedW : null;
    const grade = gradeFor(final, model.subject.grades);
    return { final, grade, predictedW, unpredictedW, fill, requiredRest, assumption };
  }

  // What-if for one upcoming test. Everything is measured against the course-end target T:
  //   afterFor(marks)    -> the subject percentage right after this test
  //   needRestFor(marks) -> the average still needed on the other remaining tests to finish at T (null if none)
  //   planPct/planMarks  -> the even plan: the same percentage on every remaining test, weighted by weightage
  function whatIfContext(model, T, testId) {
    const test = model.upcoming.find(u => u.id === testId && u.included);
    if (!test) return null;
    const { sumC, Wc, Wu, Wtotal } = model;
    const restW = Wu - test.w;
    const afterFor = marks => (sumC + pct(marks, test.max) * test.w) / (Wc + test.w);
    const needRestFor = marks => (restW > 1e-9 && T != null) ? (T * Wtotal - sumC - pct(marks, test.max) * test.w) / restW : null;
    const planPct = (T != null && Wu > 0) ? (T * Wtotal - sumC) / Wu : null;
    const planMarks = planPct == null ? null : marksFor(planPct, test.max);
    const finalOK = marks => T == null ? false : restW > 1e-9 ? needRestFor(marks) <= 100 + EPS : afterFor(marks) >= T - EPS;
    return { test, T, restW, afterFor, needRestFor, planPct, planMarks, finalOK, achievable: planPct != null && planPct <= 100 + EPS, secured: planPct != null && planPct <= EPS };
  }

  function whatIfRows(ctx, extraMarks) {
    const max = ctx.test.max;
    const step = max <= 20 ? 1 : max <= 50 ? 5 : max <= 100 ? 10 : Math.ceil(max / 10);
    const set = new Set();
    for (let m = 0; m <= max; m += step) set.add(m);
    set.add(max);
    if (ctx.planMarks != null && ctx.planMarks >= 0 && ctx.planMarks <= max) set.add(ctx.planMarks);
    if (extraMarks != null && extraMarks >= 0 && extraMarks <= max) set.add(extraMarks);
    return [...set].sort((a, b) => a - b).map(m => ({
      marks: m, pct: pct(m, max), after: ctx.afterFor(m), needRest: ctx.needRestFor(m),
      finalOK: ctx.finalOK(m), isPlan: m === ctx.planMarks, isCustom: m === extraMarks,
    }));
  }

  // Overall performance across subjects. items: [{subject, value}]
  function overall(items, method) {
    const valid = items.filter(i => i.value != null && isFinite(i.value));
    if (!valid.length) return { value: null, method, count: 0, totalWeight: 0 };
    if (method === 'weighted') {
      const wi = valid.filter(i => num(i.subject.weight) != null && +i.subject.weight > 0);
      const W = sum(wi.map(i => +i.subject.weight));
      const allW = sum(items.filter(i => num(i.subject.weight) != null && +i.subject.weight > 0).map(i => +i.subject.weight));
      if (W <= 0) return { value: null, method, count: 0, totalWeight: allW, reason: 'no_weights' };
      return { value: sum(wi.map(i => i.value * +i.subject.weight)) / W, method, count: wi.length, totalWeight: allW };
    }
    return { value: sum(valid.map(i => i.value)) / valid.length, method: 'simple', count: valid.length, totalWeight: 0 };
  }

  return { num, sum, round, pct, hasWeight, sortedGrades, gradeFor, boundaryFor, resolveTarget, subjectMode, buildModel, weightSummary, analyze, marksFor, predict, whatIfContext, whatIfRows, overall };
})();
if (typeof module !== 'undefined' && module.exports) module.exports = Engine;

/* ---------- Utilities ---------- */
const $ = sel => document.querySelector(sel);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : 'id-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const r1 = v => (v == null || !isFinite(v)) ? null : Math.round(v * 10) / 10;
const fmtNum = (v, d = 1) => (v == null || !isFinite(v)) ? '—' : String(Math.round(v * 10 ** d) / 10 ** d);
const fmtPct = (v, d = 1) => (v == null || !isFinite(v)) ? '—' : fmtNum(v, d) + '%';
const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const MONTHS_LONG = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
const DOW = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
const pad2 = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
const parseISO = s => { if (!s || !/^\d{4}-\d{2}-\d{2}$/.test(s)) return null; const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const todayISO = () => iso(new Date());
const addDaysISO = (s, n) => { const d = parseISO(s) || new Date(); d.setDate(d.getDate() + n); return iso(d); };
const fmtDate = s => { const d = parseISO(s); return d ? `${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}` : 'No date'; };
const fmtShort = s => { const d = parseISO(s); return d ? `${d.getDate()} ${MONTHS[d.getMonth()]}` : '—'; };
const daysUntil = s => { const d = parseISO(s); if (!d) return null; return Math.round((d - parseISO(todayISO())) / 86400000); };
const relDays = s => { const n = daysUntil(s); if (n == null) return ''; if (n === 0) return 'Today'; if (n === 1) return 'Tomorrow'; if (n === -1) return 'Yesterday'; return n > 0 ? `in ${n} days` : `${-n} days ago`; };
const byDate = (a, b) => (a.date || '9999').localeCompare(b.date || '9999');
const byDateDesc = (a, b) => (b.date || '').localeCompare(a.date || '');

const COLORS = ['#2457e6', '#7c3aed', '#059669', '#d97706', '#e11d48', '#0891b2', '#ea580c', '#c026d3', '#65a30d', '#475569'];
const TYPES = ['Pen and paper', 'Creative', 'Exit ticket'];
const MAX_SUBJECTS = 10;

const PRESETS = {
  'igcse': { label: 'A* – G (IGCSE)', grades: [['A*', 90, 100], ['A', 80, 89.99], ['B', 70, 79.99], ['C', 60, 69.99], ['D', 50, 59.99], ['E', 40, 49.99], ['F', 30, 39.99], ['G', 20, 29.99]] },
  'uk': { label: 'A* – E', grades: [['A*', 90, 100], ['A', 80, 89.99], ['B', 70, 79.99], ['C', 60, 69.99], ['D', 50, 59.99], ['E', 40, 49.99]] },
  'ukf': { label: 'A* – F', grades: [['A*', 90, 100], ['A', 80, 89.99], ['B', 70, 79.99], ['C', 60, 69.99], ['D', 50, 59.99], ['E', 40, 49.99], ['F', 0, 39.99]] },
  'ib': { label: '7 – 1 (IB)', grades: [['7', 80, 100], ['6', 70, 79.99], ['5', 60, 69.99], ['4', 50, 59.99], ['3', 40, 49.99], ['2', 30, 39.99], ['1', 0, 29.99]] },
  'us': { label: 'A – F (US)', grades: [['A', 90, 100], ['B', 80, 89.99], ['C', 70, 79.99], ['D', 60, 69.99], ['F', 0, 59.99]] },
  'gcse9': { label: '9 – 1 (GCSE)', grades: [['9', 90, 100], ['8', 80, 89.99], ['7', 70, 79.99], ['6', 60, 69.99], ['5', 50, 59.99], ['4', 40, 49.99], ['3', 30, 39.99], ['2', 20, 29.99], ['1', 10, 19.99]] },
};
const presetGrades = key => (PRESETS[key] || PRESETS.igcse).grades.map(([name, min, max]) => ({ name, min, max }));

const DEFAULT_SUBJECTS = [['ICT', 'ICT'], ['English Literature', 'ENG LIT'], ['English Language', 'ENG LANG'], ['Business', 'BUS'], ['International Mathematics', 'INT MATH'], ['Hindi', 'HINDI'], ['Physics', 'PHY'], ['Chemistry', 'CHEM'], ['Biology', 'BIO'], ['Global Perspectives', 'GP']];
const makeDefaultSubjects = () => DEFAULT_SUBJECTS.map(([name, code], i) => ({ id: uid(), name, code, target: 'A*', mode: 'auto', color: i, weight: null, grades: presetGrades('igcse') }));

/* ---------- State ---------- */
const KEY = 'astar-planner.v2';
let storageOK = true;
const defaultState = () => ({ version: 2, updatedAt: 0, settings: { theme: 'system', overallMethod: 'simple', predAssumption: 'current' }, subjects: makeDefaultSubjects(), assessments: [], upcoming: [] });

function normalize(raw) {
  const s = defaultState();
  if (!raw || typeof raw !== 'object') return s;
  Object.assign(s.settings, raw.settings || {});
  s.updatedAt = Number(raw.updatedAt) || 0;
  const arr = v => Array.isArray(v) ? v : [];
  s.subjects = arr(raw.subjects).filter(x => x && x.name).slice(0, MAX_SUBJECTS).map((x, i) => ({
    id: x.id || uid(), name: String(x.name), code: x.code ? String(x.code) : '',

function computeSubject(s) {

  const analysis = Engine.analyze(model, target.min);
  const ws = Engine.weightSummary(model);
  const ups = state.upcoming.filter(u => u.subjectId === s.id).sort(byDate);
  const next = ups.find(u => (daysUntil(u.date) ?? 0) >= 0) || ups[0] || null;
  return { subject: s, model, target, analysis, ws, next };
}
function computeAll() { return state.subjects.map(computeSubject); }

}

function prioSort(a, b) {
  const d = PRIO[a.analysis.status] - PRIO[b.analysis.status];

function statusInfo(c) {

    case 'impossible': return { kind: 'bad', short: `${T} not achievable`, long: `${T} is not achievable with the remaining assessments. Highest possible final percentage: ${fmtPct(a.maxPossible)}.` };

  ${storageOK ? '' : `<div class="notice">Browser storage is unavailable here, so changes will not survive a refresh. Use Export in Settings to keep a backup.</div>`}
  ${hasData ? '' : `<div class="card hint-card"><div><h2>Start with one subject</h2><p class="muted" style="margin-top:4px">Open a subject, add the tests you have already done, then add the upcoming ones with their weightage. It works out what you need for A*.</p></div><button class="btn sm" data-action="load-demo">See it with sample data</button></div>`}
  <div class="grid auto">${all.map(subjectCard).join('')}${state.subjects.length < MAX_SUBJECTS ? `<button class="card clickable empty" data-action="add-subject" style="border-style:dashed">${icon('plus')} Add subject</button>` : ''}</div>
  ${ups.length ? `<div class="card"><div class="section-head"><h2>Coming up</h2><button class="btn sm ghost" data-action="nav" data-view="upcoming">All upcoming tests ${icon('right')}</button></div>
    <div class="list">${ups.map(u => { const c = all.find(x => x.subject.id === u.subjectId); return `<div class="list-row" data-action="open-event" data-id="${u.id}" role="button" tabindex="0"><span class="swatch" style="background:${color(c.subject)}"></span><div class="when"><div class="strong tnum">${esc(fmtShort(u.date))}</div><div class="xs muted">${esc(relDays(u.date))}</div></div><div class="txt"><div class="strong">${esc(u.name)}</div><div class="xs muted">${esc(c.subject.name)} · /${fmtNum(u.max)} marks${u.weight != null ? ` · ${fmtNum(u.weight)}%` : ''}</div></div><div class="r">${requiredCell(c, u)}</div></div>`; }).join('')}</div></div>` : ''}`;
}
function subjectCard(c) {
  const { subject: s, model, target, analysis: a } = c; const st = statusInfo(c);
  const nx = a.next;
  const nxLine = nx ? (a.perTest.length > 1 ? `Need ${fmtPct(Math.max(0, a.required))} on each remaining test · ${esc(nx.name)} ${nx.marks}/${fmtNum(nx.max)}` : `Need ${nx.marks}/${fmtNum(nx.max)} (${fmtPct(Math.max(0, nx.pct))}) on ${esc(nx.name)} for ${esc(target.name)}`) : null;
  const line = a.status === 'empty' ? 'No results yet' : a.status === 'needs' ? (nxLine || `Need ${fmtPct(a.required)} average on upcoming tests for ${esc(target.name)}`) : a.status === 'on_track' ? (nxLine || `On track for ${esc(target.name)}`) : a.status === 'secured' ? `${esc(target.name)} secured` : a.status === 'impossible' ? `${esc(target.name)} out of reach · best ${fmtPct(a.maxPossible)}` : a.status === 'missed' ? `Finished below ${esc(target.name)}` : st.short;
  return `<div class="card subject-card clickable" data-action="open-subject" data-id="${s.id}" role="button" tabindex="0">
    <div class="head"><div class="title"><span class="dot" style="background:${color(s)}"></span><h3>${esc(s.name)}</h3></div>${s.code ? `<span class="xs muted">${esc(s.code)}</span>` : ''}</div>
    <div class="row between"><span class="pct">${fmtPct(model.current)}</span>${model.current != null ? gradeChip(model.grade, target.name) : ''}</div>
    ${progressBar(model.current, target.min, fillClass(c))}
    <div class="bar-labels"><span>${esc(target.name)} at ${fmtPct(target.min)}</span><span>${c.next ? `Next ${esc(fmtShort(c.next.date))}` : ''}</span></div>
    <div class="need small" style="color:var(--${st.kind === 'neutral' ? 'muted' : st.kind})">${line}</div></div>`;
}

/* ---------- Subjects ---------- */
function viewSubjects(all) {
  return `<div class="page-head"><div><div class="eyebrow">${state.subjects.length} of ${MAX_SUBJECTS}</div><h1>Subjects</h1></div>

}

    <div class="actions"><button class="btn" data-action="edit-subject" data-id="${s.id}">${icon('edit')}Rename</button><button class="btn danger" data-action="delete-subject" data-id="${s.id}">${icon('trash')}Delete</button></div></div>

    <div class="ov-grid">

      <div><div class="label">Target</div><div class="row" style="gap:10px"><span class="big">${esc(target.name)}</span><span class="muted">from ${fmtPct(target.min)}</span></div><div class="xs muted">${a.distance == null ? '' : a.distance > 0 ? `${fmtPct(a.distance)} below the boundary` : `${fmtPct(-a.distance)} above the boundary`}</div></div>
    </div>
    ${progressBar(m.current, target.min, fillClass(c))}<div class="bar-labels"><span>${fmtPct(m.current)}</span><span>${esc(target.name)} ${fmtPct(target.min)}</span></div>
    <div style="margin-top:14px">${statusLine(c)}</div>
    ${['needs', 'on_track'].includes(a.status) ? `<div class="stack" style="margin-top:14px"><div class="label">What you need on the remaining tests</div>${neededRows(c)}</div>` : ''}
  </div>

  <div class="card"><div class="section-head"><h2>Upcoming tests</h2><button class="btn sm primary" data-action="add-upcoming" data-subject="${s.id}">${icon('plus')}Add upcoming test</button></div>
    ${upcoming.length ? `<div class="table-wrap"><table class="t"><thead><tr><th>Test</th><th>Date</th><th class="r">Marks</th><th class="r">Weightage</th><th class="r">Need for ${esc(target.name)}</th><th></th></tr></thead><tbody>
      ${upcoming.map(u => `<tr><td><div class="strong">${esc(u.name)}</div>${u.target ? `<div class="xs muted">Target ${esc(u.target)}</div>` : ''}${u.notes ? `<div class="xs muted">${esc(u.notes)}</div>` : ''}</td><td class="tnum">${esc(fmtDate(u.date))}<div class="xs muted">${esc(relDays(u.date))}</div></td><td class="r num">/${fmtNum(u.max)}</td><td class="r num">${u.weight != null ? fmtNum(u.weight) + '%' : (m.mode === 'weighted' ? '<span class="chip warn">None</span>' : '<span class="muted">—</span>')}</td><td class="r">${requiredCell(c, u)}</td><td><div class="acts"><button class="btn sm ghost" data-action="record-result" data-id="${u.id}">Record result</button><button class="btn icon ghost" data-action="edit-upcoming" data-id="${u.id}" title="Edit">${icon('edit')}</button><button class="btn icon ghost danger" data-action="delete-upcoming" data-id="${u.id}" title="Delete">${icon('trash')}</button></div></td></tr>`).join('')}</tbody></table></div>` : `<div class="empty small">No upcoming tests yet. Add one with its weightage to see what you need.</div>`}
    ${m.mode === 'weighted' ? `<div style="margin-top:12px">${weightLine(c)}</div>` : ''}</div>

  <div class="card"><div class="section-head"><h2>Completed</h2><button class="btn sm" data-action="add-assessment" data-subject="${s.id}">${icon('plus')}Add result</button></div>
    ${completed.length ? `<div class="table-wrap"><table class="t"><thead><tr><th>Assessment</th><th>Date</th><th>Type</th><th class="r">Marks</th><th class="r">%</th><th class="r">Weightage</th><th></th></tr></thead><tbody>
      ${completed.map(x => `<tr><td><div class="strong">${esc(x.name)}</div>${x.notes ? `<div class="xs muted">${esc(x.notes)}</div>` : ''}</td><td class="tnum">${esc(fmtDate(x.date))}</td><td><span class="chip">${esc(x.type)}</span></td><td class="r num">${fmtNum(x.obtained)}/${fmtNum(x.max)}</td><td class="r num strong">${fmtPct(x.pct)}</td><td class="r num">${m.mode === 'weighted' ? (x.included ? fmtNum(x.w) + '%' : `<span class="chip warn" title="No weightage: left out of the weighted percentage">Left out</span>`) : '<span class="muted">—</span>'}</td><td><div class="acts"><button class="btn icon ghost" data-action="edit-assessment" data-id="${x.id}" title="Edit">${icon('edit')}</button><button class="btn icon ghost danger" data-action="delete-assessment" data-id="${x.id}" title="Delete">${icon('trash')}</button></div></td></tr>`).join('')}</tbody></table></div>` : `<div class="empty small">No results yet.</div>`}</div>

  <div class="card"><div class="section-head"><h2>Grade boundaries</h2><span class="muted small">Only for ${esc(s.name)}</span></div>
    <form class="form" data-form="boundaries" data-id="${s.id}">
      <div class="gb-wrap">${gbEditorHTML(grades, 'sub-gb')}
        <div class="field" style="max-width:220px"><label for="subj-target">Target grade</label><select id="subj-target" name="target">${grades.map(g => `<option value="${esc(g.name)}" ${g.name === target.name ? 'selected' : ''}>${esc(g.name)}</option>`).join('')}</select><span class="help">A grade applies from its minimum % upwards.</span></div></div>
      <div class="form-error" id="form-error"></div>
      <div class="row"><button class="btn primary" type="submit">Save boundaries</button></div></form></div>

  <details class="card details"><summary><h2>Progress graph</h2><span class="muted small">Percentage by assessment date</span></summary><div class="details-body">${progressChart(c)}</div></details>
  <details class="card details"><summary><h2>How ${fmtPct(m.current)} is calculated</h2></summary><div class="details-body stack">${breakdown(c)}${weightLine(c)}
    <div class="row"><label class="small muted" for="mode-${s.id}">Calculation mode</label><select id="mode-${s.id}" class="input" style="width:auto" data-change="subject-mode" data-id="${s.id}"><option value="auto" ${s.mode === 'auto' ? 'selected' : ''}>Auto-detect (${m.mode === 'weighted' ? 'weighted' : 'marks-based'})</option><option value="weighted" ${s.mode === 'weighted' ? 'selected' : ''}>Weighted</option><option value="marks" ${s.mode === 'marks' ? 'selected' : ''}>Marks-based</option></select></div></div></details>`;
}

/* ---------- Assessments ---------- */
function viewAssessments(all) {
  const f = ui.assessFilter;
  const list = state.assessments.filter(a => f === 'all' || a.subjectId === f).sort(byDateDesc);
  return `<div class="page-head"><div><div class="eyebrow">${state.assessments.length} recorded</div><h1>Assessments</h1></div>
    <div class="actions"><button class="btn primary" data-action="add-assessment">${icon('plus')}Add result</button></div></div>
  ${subjectChips(f, 'filter-assess')}
  <div class="card">${list.length ? `<div class="table-wrap"><table class="t"><thead><tr><th>Date</th><th>Subject</th><th>Assessment</th><th>Type</th><th class="r">Marks</th><th class="r">%</th><th class="r">Weightage</th><th></th></tr></thead><tbody>
    ${list.map(a => { const s = subjectById(a.subjectId); const p = Engine.pct(a.obtained, a.max); return `<tr><td class="tnum">${esc(fmtDate(a.date))}</td><td><span class="row" style="gap:6px;flex-wrap:nowrap"><span class="dot" style="background:${color(s)}"></span>${esc(s.name)}</span></td><td><div class="strong">${esc(a.name)}</div>${a.notes ? `<div class="xs muted">${esc(a.notes)}</div>` : ''}</td><td><span class="chip">${esc(a.type)}</span></td><td class="r num">${fmtNum(a.obtained)}/${fmtNum(a.max)}</td><td class="r num strong">${fmtPct(p)}</td><td class="r num">${a.weight != null ? fmtNum(a.weight) + '%' : '<span class="muted">—</span>'}</td><td><div class="acts"><button class="btn icon ghost" data-action="edit-assessment" data-id="${a.id}" title="Edit">${icon('edit')}</button><button class="btn icon ghost danger" data-action="delete-assessment" data-id="${a.id}" title="Delete">${icon('trash')}</button></div></td></tr>`; }).join('')}</tbody></table></div>` : `<div class="empty">No results${f !== 'all' ? ' for this subject' : ''} yet.<br><button class="btn primary" data-action="add-assessment">Add one</button></div>`}</div>`;
}

/* ---------- Upcoming ---------- */
function viewUpcoming(all) {
  const f = ui.upFilter, { key, dir } = ui.upSort;
  const rows = state.upcoming.filter(u => f === 'all' || u.subjectId === f).map(u => {
    const c = all.find(x => x.subject.id === u.subjectId); const { tgt, a, pt } = testAnalysis(c, u);
    return { u, c, tgt, a, pt, needed: pt && pt.pct != null ? pt.pct : (a.status === 'secured' ? -1 : 999) };
  });
  const cmp = { date: (a, b) => byDate(a.u, b.u), subject: (a, b) => a.c.subject.name.localeCompare(b.c.subject.name), name: (a, b) => a.u.name.localeCompare(b.u.name), weight: (a, b) => (a.u.weight ?? -1) - (b.u.weight ?? -1), max: (a, b) => a.u.max - b.u.max, needed: (a, b) => a.needed - b.needed }[key] || byDate;
  rows.sort((a, b) => cmp(a, b) * dir);
  const th = (k, label, cls = '') => `<th class="sortable ${cls}" data-action="sort-upcoming" data-key="${k}">${label}${key === k ? (dir > 0 ? ' ↑' : ' ↓') : ''}</th>`;
  return `<div class="page-head"><div><div class="eyebrow">${state.upcoming.length} scheduled</div><h1>Upcoming Tests</h1></div>
    <div class="actions"><button class="btn primary" data-action="add-upcoming">${icon('plus')}Add upcoming test</button></div></div>
  ${subjectChips(f, 'filter-upcoming')}
  <div class="card">${rows.length ? `<div class="table-wrap"><table class="t"><thead><tr>${th('date', 'Date')}${th('subject', 'Subject')}${th('name', 'Test')}${th('weight', 'Weightage', 'r')}${th('max', 'Marks', 'r')}${th('needed', 'Need for target', 'r')}<th></th></tr></thead><tbody>
    ${rows.map(({ u, c, tgt }) => { const dn = daysUntil(u.date); return `<tr><td class="tnum"><div>${esc(fmtDate(u.date))}</div><div class="xs" style="color:var(--${dn != null && dn < 0 ? 'bad' : 'muted'})">${dn != null && dn < 0 ? 'Past · record the result' : esc(relDays(u.date))}</div></td><td><span class="row" style="gap:6px;flex-wrap:nowrap"><span class="dot" style="background:${color(c.subject)}"></span>${esc(c.subject.name)}</span></td><td><div class="strong">${esc(u.name)}</div><div class="xs muted">Target ${esc(tgt.name)}${u.expected != null ? ` · expecting ${fmtPct(u.expected)}` : ''}</div></td><td class="r num">${u.weight != null ? fmtNum(u.weight) + '%' : (c.model.mode === 'marks' ? '<span class="muted">—</span>' : '<span class="chip warn">None</span>')}</td><td class="r num">/${fmtNum(u.max)}</td><td class="r">${requiredCell(c, u)}</td><td><div class="acts"><button class="btn sm ghost" data-action="record-result" data-id="${u.id}">Record result</button><button class="btn icon ghost" data-action="edit-upcoming" data-id="${u.id}" title="Edit">${icon('edit')}</button><button class="btn icon ghost danger" data-action="delete-upcoming" data-id="${u.id}" title="Delete">${icon('trash')}</button></div></td></tr>`; }).join('')}</tbody></table></div>` : `<div class="empty">No upcoming tests${f !== 'all' ? ' for this subject' : ''}.<br><button class="btn primary" data-action="add-upcoming">Add one</button></div>`}</div>`;
}

/* ---------- Calendar ---------- */
function viewCalendar(all) {
  const { mode, cursor } = ui.cal; const cur = parseISO(cursor) || new Date();
  const evByDate = {}; for (const u of state.upcoming) { if (!u.date) continue; (evByDate[u.date] = evByDate[u.date] || []).push(u); }
  const ev = u => { const s = subjectById(u.subjectId); return `<button class="ev" style="background:${color(s)}" data-action="open-event" data-id="${u.id}" title="${esc(s.name)} — ${esc(u.name)}">${esc(s.name)} — ${esc(u.name)}</button>`; };
  const t = todayISO();
  let body = '', label = '';
  if (mode === 'month') {
    const first = new Date(cur.getFullYear(), cur.getMonth(), 1);
    const startOffset = (first.getDay() + 6) % 7;
    const start = new Date(first); start.setDate(1 - startOffset);
    const daysInMonth = new Date(cur.getFullYear(), cur.getMonth() + 1, 0).getDate();
    const weeks = Math.ceil((startOffset + daysInMonth) / 7);
    label = `${MONTHS_LONG[cur.getMonth()]} ${cur.getFullYear()}`;
    let cells = '';
    for (let i = 0; i < weeks * 7; i++) {
      const d = new Date(start); d.setDate(start.getDate() + i); const k = iso(d);
      const other = d.getMonth() !== cur.getMonth();
      const evs = (evByDate[k] || []).sort((a, b) => a.name.localeCompare(b.name));
      cells += `<div class="cal-cell ${other ? 'other' : ''} ${k === t ? 'today' : ''}"><span class="d">${d.getDate()}</span>${evs.map(ev).join('')}</div>`;
    }
    body = `<div class="cal-grid">${DOW.map(d => `<div class="cal-dow">${d}</div>`).join('')}${cells}</div>`;
  } else if (mode === 'week') {
    const start = new Date(cur); start.setDate(cur.getDate() - ((cur.getDay() + 6) % 7));
    const end = new Date(start); end.setDate(start.getDate() + 6);
    label = `${start.getDate()} ${MONTHS[start.getMonth()]} – ${end.getDate()} ${MONTHS[end.getMonth()]} ${end.getFullYear()}`;
    let cells = '';
    for (let i = 0; i < 7; i++) {
      const d = new Date(start); d.setDate(start.getDate() + i); const k = iso(d);
      const evs = (evByDate[k] || []);
      cells += `<div class="cal-cell ${k === t ? 'today' : ''}"><span class="d">${DOW[i]} ${d.getDate()} ${MONTHS[d.getMonth()]}</span>${evs.map(u => { const s = subjectById(u.subjectId); return `<button class="ev" style="background:${color(s)};white-space:normal" data-action="open-event" data-id="${u.id}">${esc(s.name)} — ${esc(u.name)}<br><span style="font-weight:400;opacity:.9">/${fmtNum(u.max)} marks${u.weight != null ? ` · ${fmtNum(u.weight)}%` : ''}</span></button>`; }).join('') || '<span class="xs faint">—</span>'}</div>`;
    }
    body = `<div class="cal-week">${cells}</div>`;
  } else {
    const list = state.upcoming.filter(u => u.date).sort(byDate);
    label = 'All upcoming tests';
    if (!list.length) body = '<div class="empty">No upcoming tests scheduled.</div>';
    else {
      let lastM = ''; body = '<div class="cal-list">';
      for (const u of list) {
        const d = parseISO(u.date); const mk = `${MONTHS_LONG[d.getMonth()]} ${d.getFullYear()}`;
        if (mk !== lastM) { body += `<h3 class="month-h">${mk}</h3>`; lastM = mk; }
        const s = subjectById(u.subjectId); const c = all.find(x => x.subject.id === u.subjectId);
        body += `<div class="item" data-action="open-event" data-id="${u.id}" role="button" tabindex="0"><div class="day" style="color:${color(s)}">${d.getDate()}</div><div class="txt"><div class="strong">${esc(s.name)} — ${esc(u.name)}</div><div class="small muted">${DOW[(d.getDay() + 6) % 7]} · /${fmtNum(u.max)} marks${u.weight != null ? ` · ${fmtNum(u.weight)}% weightage` : ''} · ${esc(relDays(u.date))}</div></div><div>${requiredCell(c, u)}</div></div>`;
      }
      body += '</div>';
    }
  }
  return `<div class="page-head"><div><div class="eyebrow">Every upcoming test, automatically</div><h1>Calendar</h1></div><div class="actions"><button class="btn primary" data-action="add-upcoming">${icon('plus')}Add upcoming test</button></div></div>
  <div class="card"><div class="cal-toolbar"><div class="seg">${['month', 'week', 'list'].map(m => `<button class="${mode === m ? 'active' : ''}" data-action="cal-mode" data-mode="${m}">${m[0].toUpperCase() + m.slice(1)}</button>`).join('')}</div>
    <h2 style="font-size:1.1rem">${esc(label)}</h2>
    <div class="row">${mode !== 'list' ? `<button class="btn icon" data-action="cal-nav" data-dir="-1" title="Previous">${icon('left')}</button><button class="btn sm" data-action="cal-today">Today</button><button class="btn icon" data-action="cal-nav" data-dir="1" title="Next">${icon('right')}</button>` : ''}</div></div>
    <div style="margin-top:14px">${body}</div>
    <div class="legend" style="margin-top:14px">${state.subjects.map(s => `<span><span class="dot" style="background:${color(s)}"></span>${esc(s.name)}</span>`).join('')}</div></div>`;
}

/* ---------- A* Calculator ---------- */
function viewCalc(all) {
  if (!all.length) return `<div class="page-head"><h1>A* Calculator</h1></div><div class="empty">Add a subject first.</div>`;
  if (!ui.calc.subjectId || !subjectById(ui.calc.subjectId)) ui.calc.subjectId = (all.find(c => c.model.upcoming.length) || all[0]).subject.id;
  const c = all.find(x => x.subject.id === ui.calc.subjectId);
  const { subject: s, model: m, target, analysis: a } = c; const st = statusInfo(c);
  const ups = m.upcoming.filter(u => u.included);
  if (!ui.calc.testId || !ups.find(u => u.id === ui.calc.testId)) { ui.calc.testId = ups[0] ? ups[0].id : null; ui.calc.marks = null; }
  const nx = a.next; const nt = nx ? needText(nx, c) : null;
  const headline = nx && ['needs', 'on_track'].includes(a.status) ? `<div class="big" style="color:var(--${nt.kind})">${fmtPct(Math.max(0, a.required))}</div><p class="muted small" style="margin:6px 0 0">${ups.length > 1 ? `on every remaining test (weighted by weightage) to finish at ${esc(target.name)}. Next: <b>${esc(nx.name)}</b> ${nx.marks}/${fmtNum(nx.max)}` : `on <b>${esc(nx.name)}</b> (${nx.marks}/${fmtNum(nx.max)}) to finish at ${esc(target.name)}`}</p>`
    : a.status === 'impossible' ? `<div class="big" style="color:var(--bad)">${fmtPct(a.maxPossible)}</div><p class="muted small" style="margin:6px 0 0">is the highest final percentage still possible</p>`
    : a.status === 'secured' ? `<div class="big" style="color:var(--good)">${fmtPct(a.minPossible)}</div><p class="muted small" style="margin:6px 0 0">is the lowest final percentage possible, already above ${fmtPct(target.min)}</p>`

  return `<div class="page-head"><div><div class="eyebrow">How much do I need?</div><h1>A* Calculator</h1></div></div>
  ${subjectChips(s.id, 'calc-subject', false)}

    <div class="card"><div class="label">Now</div>

      <div class="xs muted" style="margin-top:4px">${m.mode === 'weighted' ? `${fmtNum(m.Wc)}% of the course completed · ${fmtNum(m.Wu)}% still to come` : `${fmtNum(m.marksMax)} marks completed · ${fmtNum(m.Wu)} marks still to come`}</div>
      ${progressBar(m.current, target.min, fillClass(c))}<div class="bar-labels"><span>${fmtPct(m.current)}</span><span>${esc(target.name)} ${fmtPct(target.min)}</span></div></div>

  </div>
  <div class="card"><div class="section-head"><h2>What if?</h2><span class="muted small">Try a score and see the result instantly</span></div>
    ${ups.length ? `<div class="form" style="margin-bottom:14px;max-width:460px"><div class="field"><label for="wi-test">Upcoming test</label><select id="wi-test" class="input" data-change="calc-test">${ups.map(u => `<option value="${u.id}" ${u.id === ui.calc.testId ? 'selected' : ''}>${esc(u.name)} · ${esc(fmtShort(u.date))} · /${fmtNum(u.max)}${m.mode === 'weighted' ? ` · ${fmtNum(u.w)}%` : ''}</option>`).join('')}</select></div></div>
      <div id="whatif-panel">${whatIfPanel(c)}</div>` : `<div class="empty small">Add an upcoming test for ${esc(s.name)} to try scores.</div>`}
  </div>
  <details class="card details"><summary><h2>Target planner</h2><span class="muted small">Set a target for every subject</span></summary><div class="details-body">
    <div class="table-wrap"><table class="t"><thead><tr><th>Subject</th><th>Target</th><th class="r">Current</th><th class="r">Boundary</th><th>Needs</th></tr></thead><tbody>
    ${all.map(x => { const sx = statusInfo(x); const gs = Engine.sortedGrades(x.subject.grades); return `<tr><td><span class="row" style="gap:6px;flex-wrap:nowrap"><span class="dot" style="background:${color(x.subject)}"></span><b>${esc(x.subject.name)}</b></span></td><td><select class="input" style="width:auto;padding:5px 8px" data-change="subject-target" data-id="${x.subject.id}">${gs.map(g => `<option value="${esc(g.name)}" ${g.name === x.target.name ? 'selected' : ''}>${esc(g.name)}</option>`).join('')}</select></td><td class="r num">${fmtPct(x.model.current)}</td><td class="r num">${fmtPct(x.target.min)}</td><td><span class="chip ${sx.kind}">${esc(sx.short)}</span> <span class="small muted">${x.analysis.perTest.length && ['needs', 'on_track'].includes(x.analysis.status) ? (() => { const n = x.analysis.next; return `${fmtPct(Math.max(0, x.analysis.required))} on each remaining test · next ${esc(n.name)} ${n.marks}/${fmtNum(n.max)}`; })() : ''}</span></td></tr>`; }).join('')}</tbody></table></div></div></details>`;
}
function whatIfCtx(c) {
  const ctx = Engine.whatIfContext(c.model, c.target.min, ui.calc.testId);
  if (!ctx) return null;
  const max = ctx.test.max;
  if (ui.calc.marks == null || ui.calc.marks > max) ui.calc.marks = ctx.planMarks != null ? clamp(ctx.planMarks, 0, max) : Math.round(max * 0.8);
  return ctx;
}
function whatIfPanel(c) {
  const { target } = c; const ctx = whatIfCtx(c);
  if (!ctx) return '';
  const max = ctx.test.max, marks = ui.calc.marks;
  const plan = ctx.planPct == null ? '' : ctx.secured ? `<span class="chip good">${esc(target.name)} already secured</span>` : !ctx.achievable ? `<span class="chip bad">${esc(target.name)} not achievable (needs ${fmtPct(ctx.planPct)} on the rest)</span>` : `<span class="chip good">Plan: ${ctx.planMarks}/${fmtNum(max)} (${fmtPct(ctx.planPct)}) here${ctx.restW > 1e-9 ? ` and ${fmtPct(ctx.planPct)} on every other remaining test` : ''}</span>`;
  return `<div class="whatif-result">
    <div class="card pad-s soft"><div class="label">If I score</div>
      <div class="range-row" style="margin-top:8px"><div class="inline-num"><input id="wi-marks" type="number" min="0" max="${max}" step="1" value="${marks}" data-live="calc-marks" aria-label="Hypothetical marks"><span class="muted">/ ${fmtNum(max)}</span></div><span class="chip" id="wi-pct">${fmtPct(Engine.pct(marks, max))}</span></div>
      <input id="wi-slider" class="slider" type="range" min="0" max="${max}" step="1" value="${marks}" data-live="calc-marks" aria-label="Hypothetical marks slider" style="margin-top:10px">
      <div class="xs muted" style="margin-top:6px">${plan}</div></div>
    <div id="whatif-out" style="display:contents">${whatIfOut(c, ctx)}</div>
  </div>`;
}
function whatIfOut(c, ctx) {
  const { target } = c; const max = ctx.test.max, marks = ui.calc.marks;
  const after = ctx.afterFor(marks), rest = ctx.needRestFor(marks), ok = ctx.finalOK(marks);
  const g = Engine.gradeFor(after, c.subject.grades);
  const rows = Engine.whatIfRows(ctx, marks);
  const multi = ctx.restW > 1e-9;
  const restKind = !multi ? '' : rest <= 1e-9 ? 'good' : rest <= (c.model.current ?? 0) + 1e-9 ? 'good' : rest <= 100 + 1e-9 ? 'warn' : 'bad';
  const card = multi
    ? `<div class="card pad-s soft"><div class="label">Then, on the remaining tests</div>
        <div class="row" style="margin-top:8px;gap:12px"><span class="big" style="color:var(--${restKind === 'warn' ? 'fg' : restKind})">${rest <= 1e-9 ? 'Any score' : fmtPct(rest)}</span></div>
        <div class="xs muted" style="margin-top:6px">${rest > 100 + 1e-9 ? `needed on average, so ${esc(target.name)} would be out of reach` : rest <= 1e-9 ? `keeps ${esc(target.name)}` : `average needed on the other remaining tests (weighted) to finish at ${esc(target.name)}`}. You would be at ${fmtPct(after)} right after this test.</div></div>`
    : `<div class="card pad-s soft"><div class="label">Final percentage</div>
        <div class="row" style="margin-top:8px;gap:12px"><span class="big" style="color:var(--${ok ? 'good' : 'fg'})">${fmtPct(after)}</span>${gradeChip(g, target.name)}</div>
        <div class="xs muted" style="margin-top:6px">${ok ? `At or above the ${esc(target.name)} boundary (${fmtPct(target.min)})` : `${fmtPct(target.min - after)} short of ${esc(target.name)}`}</div></div>`;
  return `${card}
  <div class="table-wrap" style="grid-column:1 / -1"><table class="t"><thead><tr><th>Score</th><th class="r">Test %</th><th class="r">${multi ? '% after this test' : 'Final %'}</th>${multi ? '<th class="r">Needed on the rest</th>' : '<th>Grade</th>'}</tr></thead><tbody>
    ${rows.map(r => `<tr class="${r.isPlan ? 'hl' : ''} ${r.isCustom && !r.isPlan ? 'custom' : ''}"><td class="num">${r.marks}/${fmtNum(max)}${r.isPlan ? ' <span class="chip good">Plan</span>' : r.isCustom ? ' <span class="chip primary">Your input</span>' : ''}</td><td class="r num">${fmtPct(r.pct)}</td><td class="r num strong">${fmtPct(r.after)}</td>${multi ? `<td class="r num strong" style="color:var(--${r.needRest > 100 + 1e-9 ? 'bad' : r.needRest <= 1e-9 ? 'good' : 'fg'})">${r.needRest <= 1e-9 ? 'Any' : fmtPct(r.needRest)}${r.needRest > 100 + 1e-9 ? ' ✕' : ''}</td>` : `<td>${gradeChip(Engine.gradeFor(r.after, c.subject.grades), target.name, 'xs')}</td>`}</tr>`).join('')}</tbody></table></div>`;
}

/* ---------- Predictions ---------- */
function viewPredictions(all) {
  const withUp = all.filter(c => c.model.upcoming.some(u => u.included));
  const assumption = state.settings.predAssumption || 'current';
  const preds = all.map(c => ({ c, p: Engine.predict(c.model, c.target.min, assumption) }));
  const ov = Engine.overall(preds.map(({ c, p }) => ({ subject: c.subject, value: p.final })), state.settings.overallMethod);
  const ovNow = overallInfo(all);
  return `<div class="page-head"><div><div class="eyebrow">Enter the scores you expect</div><h1>Predictions</h1></div>
    <div class="actions"><div class="field"><label for="pred-assume">Tests without a prediction</label><select id="pred-assume" class="input" data-change="pred-assumption"><option value="current" ${assumption === 'current' ? 'selected' : ''}>Assume current average</option><option value="target" ${assumption === 'target' ? 'selected' : ''}>Assume target boundary</option><option value="zero" ${assumption === 'zero' ? 'selected' : ''}>Assume 0%</option></select></div></div></div>
  <div class="card row between"><div><div class="label">Predicted overall</div><div class="big" id="pred-overall">${fmtPct(ov.value)}</div></div><div class="small muted">${state.settings.overallMethod === 'weighted' ? 'Weighted by subject' : 'Simple average'} · currently ${fmtPct(ovNow.value)}</div></div>
  ${withUp.length ? `<div class="grid cols-2">${withUp.map(c => predCard(c, assumption)).join('')}</div>` : '<div class="empty">Add upcoming tests to predict final grades.</div>'}`;
}
function predCard(c, assumption) {
  const { subject: s, model: m, target } = c;
  const ups = m.upcoming.filter(u => u.included).sort(byDate);
  return `<div class="card" id="pred-${s.id}"><div class="section-head"><div class="row" style="gap:8px"><span class="dot" style="background:${color(s)}"></span><h2>${esc(s.name)}</h2></div><span class="muted small">Now ${fmtPct(m.current)} · target ${esc(target.name)} ${fmtPct(target.min)}</span></div>
    <div>${ups.map(u => `<div class="pred-row"><div class="nm"><div class="strong">${esc(u.name)}</div><div class="xs muted">${esc(fmtShort(u.date))} · ${m.mode === 'weighted' ? fmtNum(u.w) + '%' : fmtNum(u.max) + ' marks'}</div></div>
      <div class="inline-num"><input type="number" min="0" max="${u.max}" step="0.5" placeholder="marks" value="${u.expectedPct != null ? fmtNum(u.expectedPct / 100 * u.max, 1) : ''}" data-live="pred-marks" data-id="${u.id}" data-max="${u.max}" aria-label="Expected marks for ${esc(u.name)}"><span class="muted xs">/${fmtNum(u.max)}</span></div>
      <div class="inline-num"><input type="number" min="0" max="100" step="0.1" placeholder="%" value="${u.expectedPct != null ? fmtNum(u.expectedPct, 1) : ''}" data-live="pred-pct" data-id="${u.id}" data-max="${u.max}" aria-label="Expected percentage for ${esc(u.name)}"><span class="muted xs">%</span></div>
      <button class="btn icon ghost" data-action="pred-clear" data-id="${u.id}" title="Clear prediction">${icon('x')}</button></div>`).join('')}</div>
    <div id="pred-result-${s.id}" style="margin-top:12px">${predResult(c, assumption)}</div></div>`;
}
function predResult(c, assumption) {
  const { model: m, target } = c; const p = Engine.predict(m, target.min, assumption);
  const ok = p.final != null && target.min != null && p.final >= target.min - 1e-9;
  const fillNote = p.unpredictedW > 0 ? `<div class="xs muted" style="margin-top:6px">${m.mode === 'weighted' ? fmtNum(p.unpredictedW) + '% of weightage' : fmtNum(p.unpredictedW) + ' marks'} without a prediction assumed at ${fmtPct(p.fill)}${p.requiredRest != null && !ok ? ` · you would need ${fmtPct(p.requiredRest)} on those to reach ${esc(target.name)}` : ''}.</div>` : '';
  return `<div class="row between soft" style="padding:12px 14px;border-radius:12px;${ok ? 'background:var(--good-soft)' : ''}"><div><div class="label">Predicted final</div><div class="row" style="gap:10px"><span class="big" style="font-size:1.8rem;color:var(--${ok ? 'good' : 'fg'})">${fmtPct(p.final)}</span>${gradeChip(p.grade, target.name)}</div></div><div class="small" style="color:var(--${ok ? 'good' : 'muted'})">${ok ? `Reaches ${esc(target.name)}` : `${fmtPct(target.min - (p.final ?? 0))} short of ${esc(target.name)}`}</div></div>${fillNote}`;
}

  <div class="grid cols-2">

    <div class="card"><h2>Overall percentage</h2><p class="muted small" style="margin:4px 0 12px">How the overall figure across subjects is worked out.</p>
      <div class="seg" style="margin-bottom:12px">${[['simple', 'Simple average'], ['weighted', 'Weighted subjects']].map(([v, l]) => `<button class="${om === v ? 'active' : ''}" data-action="set-overall" data-value="${v}">${l}</button>`).join('')}</div>
      ${om === 'weighted' ? `<div class="stack" style="gap:6px">${state.subjects.map(s => `<div class="row between"><span class="row" style="gap:6px"><span class="dot" style="background:${color(s)}"></span>${esc(s.name)}</span><div class="inline-num"><input type="number" min="0" max="100" step="0.5" value="${s.weight ?? ''}" placeholder="0" data-live="subject-weight" data-id="${s.id}" aria-label="Weight for ${esc(s.name)}"><span class="muted">%</span></div></div>`).join('')}<div id="weights-sum" class="small" style="margin-top:6px">${weightsSumText(W)}</div></div>` : '<p class="small muted">Every subject counts equally.</p>'}</div>
  </div>
  ${typeof accountCard === 'function' ? accountCard() : ''}
  <div class="card"><h2>Data</h2><p class="muted small" style="margin:4px 0 12px">Everything is saved automatically in this browser${storageOK ? '' : ' (storage is currently unavailable)'}. Export a backup to move it to another device.</p>
    <div class="row"><button class="btn" data-action="export">${icon('download')}Export</button><button class="btn" data-action="import">${icon('upload')}Import</button><button class="btn" data-action="load-demo">Load sample data</button><button class="btn" data-action="start-wizard">Set up subjects again</button><button class="btn danger" data-action="reset">${icon('trash')}Reset</button></div>
    <p class="xs muted" style="margin-top:10px">${state.subjects.length} subjects · ${state.assessments.length} results · ${state.upcoming.length} upcoming tests</p></div>
  <details class="card details"><summary><h2>How the calculations work</h2></summary><div class="details-body stack small" style="color:var(--muted)">
      <p><b style="color:var(--fg)">Percentage</b> = marks obtained ÷ maximum marks × 100.</p>
      <p><b style="color:var(--fg)">Subject percentage</b> = Σ (assessment % × weightage) ÷ Σ weightage of completed assessments. A subject switches to weighted mode as soon as any of its assessments has a weightage; assessments without one are then left out and flagged. With no weightages at all it is marks-based: total marks obtained ÷ total maximum marks.</p>
      <p><b style="color:var(--fg)">Needed on the remaining tests</b> = (target boundary × total weightage − Σ completed contributions) ÷ remaining weightage. That percentage, scored on every remaining test, finishes the course at the target; each test's weightage is respected because the subject percentage weights each test by it. The marks shown for a test are that percentage of its maximum, rounded up to a whole mark. The next test by date is listed first. Above 100% means the target is not achievable (the best possible final is shown instead); at or below 0% means it is already secured.</p>

}
const weightsSumText = W => Math.abs(W - 100) < 0.005 ? `<span style="color:var(--good)">Subject weightages add up to 100%.</span>` : `<span style="color:var(--warn)">Subject weightages add up to ${fmtNum(W)}%. The overall figure is normalised, but 100% keeps it easy to read.</span>`;

const gbRowHTML = (g, i) => `<div class="gb-row" data-gb-row><input value="${esc(g.name)}" placeholder="A*" aria-label="Grade name" data-live="gb-name"><input class="num" type="number" step="0.01" min="0" max="100" value="${g.min ?? ''}" placeholder="90" aria-label="Minimum percent" required><input class="num" type="number" step="0.01" min="0" max="100" value="${g.max ?? ''}" placeholder="100" aria-label="Maximum percent"><button type="button" class="btn icon ghost danger" data-action="gb-remove" title="Remove grade">${icon('x')}</button></div>`;
function readGbEditor(editor) {
  if (!editor) return null;
  const rows = [...editor.querySelectorAll('[data-gb-row]')].map(r => { const [n, mn, mx] = r.querySelectorAll('input'); return { name: n.value.trim(), min: Engine.num(mn.value), max: Engine.num(mx.value) }; }).filter(g => g.name && g.min != null);
  return rows.sort((a, b) => b.min - a.min);

/* Backend: Supabase accounts (email + password). Each person's planner is one row in public.planners,
   readable and writable only by that person (row level security; see supabase/schema.sql). */
const cfg = window.PLANNER_CONFIG || {};
const auth = { status: 'loading', session: null, mode: 'signin', msg: '', recovery: false, sb: null };
const cloud = { status: 'local', busy: false, dirty: false, timer: null, retry: null, lastWritten: 0, loaded: false, loading: false };
const configured = () => typeof cfg.supabaseUrl === 'string' && /^https:\/\/[a-z0-9-]+\.supabase\.(co|in)\/?$/.test(cfg.supabaseUrl.trim()) && typeof cfg.supabaseAnonKey === 'string' && cfg.supabaseAnonKey.trim().length > 20 && !/YOUR-/i.test(cfg.supabaseAnonKey);
function storageKey() { return auth.session && auth.session.user ? KEY + '.' + auth.session.user.id : null; }
const userEmail = () => (auth.session && auth.session.user && auth.session.user.email) || '';
const siteUrl = () => location.origin + location.pathname.replace(/index\.html$/, '');

/* ---------- Screens shown instead of the app ---------- */

}

  auth.sb = window.supabase.createClient(cfg.supabaseUrl.trim(), cfg.supabaseAnonKey.trim(), { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } });

/* ---------- Auth actions & forms ---------- */
function friendly(e) {
  const m = (e && e.message) ? e.message : String(e || '');
  if (/invalid login credentials/i.test(m)) return 'Wrong email or password.';
  if (/already registered|already exists/i.test(m)) return 'An account with this email already exists. Sign in instead.';
  if (/email not confirmed/i.test(m)) return 'Confirm your email first (check your inbox for the link), then sign in.';
  if (/rate limit/i.test(m)) return 'Too many emails were sent for now. Try again in a little while.';
  if (/signups not allowed|not allowed/i.test(m)) return 'Sign-ups are turned off for this site.';
  if (/password/i.test(m) && /least|short|weak/i.test(m)) return m;
  if (/failed to fetch|network|load failed/i.test(m)) return 'Could not reach the server. Check your connection and try again.';
  if (/valid email/i.test(m)) return 'Enter a valid email address.';
  return m || 'Something went wrong. Please try again.';
}
async function handleAuth(f) {

  const btn = f.querySelector('button[type="submit"]'); const label = btn ? btn.textContent : '';
  const busy = on => { if (!btn) return; btn.disabled = on; btn.textContent = on ? 'Please wait…' : label; };
  const box = f.querySelector('.form-error'); const setError = msg => { if (box) box.textContent = msg; };
  setError('');
  try {
    if (!auth.sb) throw new Error('Could not reach the server. Reload the page and try again.');
    if (mode !== 'newpass' && !/^\S+@\S+\.\S+$/.test(email)) throw new Error('Enter a valid email address.');
    if ((mode === 'signup' || mode === 'newpass') && pw.length < 8) throw new Error('Use a password of at least 8 characters.');
    if ((mode === 'signup' || mode === 'newpass') && pw !== confirm) throw new Error('The two passwords do not match.');
    if (mode === 'signin' && !pw) throw new Error('Enter your password.');
    busy(true);
    if (mode === 'signup') {
      const { data, error } = await auth.sb.auth.signUp({ email, password: pw, options: { emailRedirectTo: siteUrl() } });
      if (error) throw error;
      if (data && data.user && Array.isArray(data.user.identities) && data.user.identities.length === 0) throw new Error('An account with this email already exists. Sign in instead.');
      if (!data || !data.session) {
        // Accounts are confirmed at creation (database trigger), so sign in straight away.
        const { error: e2 } = await auth.sb.auth.signInWithPassword({ email, password: pw });
        if (e2) { auth.mode = 'signin'; auth.msg = /not confirmed/i.test(e2.message || '') ? 'Account created. Check your email for a confirmation link, then sign in.' : 'Account created. Sign in to continue.'; render(); }
      }
    } else if (mode === 'signin') {
      const { error } = await auth.sb.auth.signInWithPassword({ email, password: pw });
      if (error) throw error;
    } else if (mode === 'reset') {
      const { error } = await auth.sb.auth.resetPasswordForEmail(email, { redirectTo: siteUrl() });
      if (error) throw error;
      auth.mode = 'signin'; auth.msg = 'If that email has an account, a reset link is on its way.'; render();
    } else if (mode === 'newpass') {
      const { error } = await auth.sb.auth.updateUser({ password: pw });
      if (error) throw error;
      auth.recovery = false; toast('Password updated'); if (f.password) { f.password.value = ''; f.confirm.value = ''; }

    }
  } catch (e) {

  }
}

const forms = {
  ...(typeof backendForms === 'object' ? backendForms : {}),
  'setup-count'(f) { ui.setupCount = clamp(parseInt(f.count.value, 10) || 1, 1, MAX_SUBJECTS); ui.setupStep = 2; render({ top: true }); },
  'setup-finish'(f) {
    const subs = [];

      if (!grades.length) { setError(`${name.trim()}: add at least one grade boundary.`); return; }
      const target = f[`target-${i}`].value;
      subs.push({ id: uid(), name: name.trim(), code: (f[`code-${i}`].value || '').trim(), target: grades.some(g => g.name === target) ? target : grades[0].name, mode: 'auto', color: subs.length % COLORS.length, weight: null, grades });
    }

    state.subjects = subs.slice(0, MAX_SUBJECTS); ui.view = 'dashboard';
